name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # The pasteable schema is a second copy of the migrations, and a
      # second copy drifts — it once shipped a release behind them.
      - run: npm run db:schema:check

      - run: npm run test

      - run: npm run build
